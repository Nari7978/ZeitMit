name: Deploy backend

on:
  push:
    branches: [claude/awesome-knuth-6avmg9, main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional: add these under Settings → Secrets and variables → Actions to switch features on.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
      TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
      EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      INVOICE_DETAILS: ${{ vars.INVOICE_DETAILS }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck

      - name: Create or find the D1 database
        run: |
          ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const db=JSON.parse(s).find(d=>d.name==='zeitmit');console.log(db?db.uuid:'')})")
          if [ -z "$ID" ]; then
            npx wrangler d1 create zeitmit --location weur
            ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).find(d=>d.name==='zeitmit').uuid))")
          fi
          echo "D1 database: $ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply zeitmit --remote

      - name: Register a workers.dev subdomain (first deploy on a new account)
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).result?.subdomain??'')}catch{console.log('')}})")
          if [ -n "$SUB" ]; then echo "Subdomain: $SUB.workers.dev"; exit 0; fi
          for NAME in zeitmit "zeitmit-$(openssl rand -hex 2)"; do
            RES=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"subdomain\":\"$NAME\"}" "$API")
            if echo "$RES" | grep -q '"success":true'; then echo "Registered $NAME.workers.dev"; exit 0; fi
            echo "Could not register $NAME: $RES"
          done
          echo "::warning::Couldn't register a workers.dev subdomain automatically. Open Workers & Pages in the Cloudflare dashboard once to pick one."

      - name: Store optional keys (Stripe, Brevo, TURN relay) as Worker secrets
        run: |
          for NAME in STRIPE_SECRET_KEY BREVO_API_KEY TURN_KEY_ID TURN_KEY_API_TOKEN; do
            VAL="${!NAME}"
            if [ -n "$VAL" ]; then printf '%s' "$VAL" | npx wrangler secret put "$NAME" >/dev/null 2>&1 && echo "✓ $NAME set" || echo "::warning::Couldn't set $NAME (it will be set after the first deploy)"; fi
          done

      - name: Deploy Worker
        run: |
          set -o pipefail
          ARGS=()
          [ -n "$ADMIN_EMAILS" ] && ARGS+=(--var "ADMIN_EMAILS:$ADMIN_EMAILS")
          [ -n "$INVOICE_DETAILS" ] && ARGS+=(--var "INVOICE_DETAILS:$INVOICE_DETAILS")
          [ -z "$ADMIN_EMAILS" ] && echo "::warning::Variable ADMIN_EMAILS is not set (Settings → Secrets and variables → Actions → Variables tab)."
          [ -n "$BREVO_API_KEY" ] && [ -z "$EMAIL_FROM_ADDRESS" ] && echo "::warning::BREVO_API_KEY is set but the variable EMAIL_FROM_ADDRESS is not (Variables tab, not Secrets), so on-screen test login codes stay on."
          if [ -n "$BREVO_API_KEY" ] && [ -n "$EMAIL_FROM_ADDRESS" ]; then
            # Real email login is configured: turn off on-screen test codes (and enable admin logins).
            ARGS+=(--var "EMAIL_FROM_ADDRESS:$EMAIL_FROM_ADDRESS" --var "DEV_LOGIN_CODES:false")
            echo "Email login: Brevo ($EMAIL_FROM_ADDRESS)"
          else
            echo "Email login: test mode (codes shown in the app)"
          fi
          [ -n "$STRIPE_SECRET_KEY" ] && echo "Payments: Stripe" || echo "Payments: simulated"
          [ -n "$TURN_KEY_ID" ] && [ -n "$TURN_KEY_API_TOKEN" ] && echo "Video dates: direct, with Cloudflare TURN relay" || echo "Video dates: direct connections only (add TURN_KEY_ID and TURN_KEY_API_TOKEN secrets for the relay)"
          if ! npx wrangler deploy "${ARGS[@]}" 2>&1 | tee deploy.log; then
            grep -iE "error|✘|\[ERROR\]|code:" deploy.log | head -15 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Create JWT_SECRET on first deploy
        run: |
          if ! npx wrangler secret list --format json | grep -q '"JWT_SECRET"'; then
            openssl rand -hex 32 | npx wrangler secret put JWT_SECRET
          fi

      - name: Video call relay check
        if: ${{ env.TURN_KEY_ID != '' && env.TURN_KEY_API_TOKEN != '' }}
        run: |
          # The TURN key can hand out relay credentials, as the API does for every video date (nothing secret is printed).
          CODE=$(curl -s -o turn.json -w '%{http_code}' -m 20 -X POST "https://rtc.live.cloudflare.com/v1/turn/keys/$TURN_KEY_ID/credentials/generate-ice-servers" \
            -H "Authorization: Bearer $TURN_KEY_API_TOKEN" -H 'Content-Type: application/json' -d '{"ttl": 300}' || true)
          if [ "${CODE:0:1}" = 2 ] && grep -q '"turn' turn.json; then
            echo "::notice::Video call relay: the Cloudflare TURN key works ($(node -e "const j=require('./turn.json');console.log([].concat(j.iceServers||[]).flatMap((x)=>[].concat(x.urls)).filter((u)=>/^turns?:/.test(u)).length+' relay addresses')"))"
          else
            echo "::warning::Video call relay: Cloudflare refused the TURN key (HTTP $CODE). Check the TURN_KEY_ID and TURN_KEY_API_TOKEN secrets."
          fi
          rm -f turn.json
      - name: Health check
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).result?.subdomain??''))")
          URL="https://zeitmit-api.$SUB.workers.dev"
          echo "API URL: $URL"
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -sf "$URL/" || true)
            if echo "$BODY" | grep -q '"ok":true'; then
              echo "::notice::API is live at $URL — $BODY — public companions: $(curl -sf "$URL/companions" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).length))")"
              # The booking engine answers for a listed companion: their free time, and the older apps' start times.
              FIRST=$(curl -sf "$URL/companions" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[0]?.id??''))")
              if [ -n "$FIRST" ]; then
                # Each check: up to 3 tries; a failure says what came back (HTTP status and the start of the body).
                check() {
                  local out=""
                  for t in 1 2 3; do
                    out=$(curl -s -m 20 -w '\n%{http_code}' "$URL$1" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const i=s.lastIndexOf('\n'),body=s.slice(0,i),code=s.slice(i+1);try{if(code!=='200')throw 0;console.log(($2)(JSON.parse(body)))}catch{console.log('failed (HTTP '+code+': '+body.slice(0,120).replace(/\s+/g,' ')+')')}})")
                    case "$out" in failed*) sleep 3;; *) break;; esac
                  done
                  echo "$out"
                }
                A=$(check "/companions/$FIRST/availability" "(a)=>a.tz+' · '+Object.entries(a.kinds).map(([k,v])=>k+': '+(v?v.open.length+' free stretches':'not offered')).join(' · ')")
                SLOTS=$(check "/companions/$FIRST/slots" "(l)=>l.reduce((n,d)=>n+d.times.length,0)")
                B=$(check "/companions/$FIRST" "(c)=>{if(!Array.isArray(c.okVideo)||c.noVideo?.length!==4)throw 0;return c.ok.length+' in person, '+c.okVideo.length+' for video dates'}")
                echo "::notice::Availability of $FIRST: $A — older apps' start times this week: $SLOTS — boundaries picked: $B"
                case "$A$SLOTS$B" in *failed*) echo "::warning::A companion check didn't answer as expected: $A / $SLOTS / $B";; esac
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Deployed, but $URL didn't answer yet (a new workers.dev subdomain can take a few minutes)."
