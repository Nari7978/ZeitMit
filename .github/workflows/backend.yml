name: Deploy backend

on:
  push:
    branches: [claude/awesome-knuth-6avmg9, main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck

      - name: Create or find the D1 database
        run: |
          ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const db=JSON.parse(s).find(d=>d.name==='zeitmit');console.log(db?db.uuid:'')})")
          if [ -z "$ID" ]; then
            npx wrangler d1 create zeitmit --location weur
            ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).find(d=>d.name==='zeitmit').uuid))")
          fi
          echo "D1 database: $ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply zeitmit --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Create JWT_SECRET on first deploy
        run: |
          if ! npx wrangler secret list --format json | grep -q '"JWT_SECRET"'; then
            openssl rand -hex 32 | npx wrangler secret put JWT_SECRET
          fi

      - name: Health check
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).result?.subdomain??''))")
          URL="https://zeitmit-api.$SUB.workers.dev"
          echo "API URL: $URL"
          for i in 1 2 3 4 5 6; do
            if curl -sf "$URL/" | grep -q '"ok":true'; then echo "✓ API is live"; exit 0; fi
            sleep 10
          done
          echo "::warning::Deployed, but $URL didn't answer yet (a new workers.dev subdomain can take a few minutes)."
