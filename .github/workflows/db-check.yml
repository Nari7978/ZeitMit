name: DB check (read-only)

on:
  workflow_dispatch:
    inputs:
      email:
        description: Account email to inspect
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EMAIL: ${{ inputs.email }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Find the D1 database
        run: |
          ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const db=JSON.parse(s).find(d=>d.name==='zeitmit');console.log(db?db.uuid:'')})")
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
      - name: Inspect the account (SELECT only)
        run: |
          case "$EMAIL" in *"'"*) echo "::error::Invalid email"; exit 1;; esac
          q() { npx wrangler d1 execute zeitmit --remote --json --command "$1" 2>&1 | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.stringify(JSON.parse(s)[0].results))}catch{console.log(s.slice(0,300))}})"; }
          U=$(q "SELECT id, length(id) AS len, hex(id) AS hex, role, suspended, id_status FROM users WHERE lower(email) = lower('$EMAIL')")
          echo "::notice::user row: $U"
          ID=$(echo "$U" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s)[0]?.id??'')}catch{console.log('')}})")
          if [ -n "$ID" ]; then
            echo "::notice::by id: $(q "SELECT COUNT(*) AS n FROM users WHERE id = '$ID'")"
            echo "::notice::linked: $(q "SELECT (SELECT COUNT(*) FROM bookings WHERE customer_id = '$ID' OR companion_id = '$ID') AS bookings, (SELECT COUNT(*) FROM conversations WHERE customer_id = '$ID' OR companion_id = '$ID') AS chats, (SELECT COUNT(*) FROM checkins WHERE user_id = '$ID') AS checkins, (SELECT COUNT(*) FROM companions WHERE user_id = '$ID') AS companion, (SELECT COUNT(*) FROM photos WHERE owner_id = '$ID') AS photos, (SELECT COUNT(*) FROM gifts WHERE sender_id = '$ID' OR redeemed_by = '$ID') AS gifts, (SELECT COUNT(*) FROM reports WHERE reporter_id = '$ID' OR target_id = '$ID') AS reports")"
          fi
          echo "::notice::all users: $(q "SELECT COUNT(*) AS n FROM users")"
